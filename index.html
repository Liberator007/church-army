<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Распорядок дня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4f0;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #8a8f98;
      --line: #e4e1da;
      --dash: #c4c0b8;
      --accent: #5865f2;
      --accent-soft: #e9ebfe;
      --glow-1: #ffe3d3;
      --glow-2: #dfe6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(40vw 40vw at 0% 0%, var(--glow-1), transparent 70%),
        radial-gradient(45vw 45vw at 100% 100%, var(--glow-2), transparent 70%);
      opacity: .8;
      pointer-events: none;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 6vh 6vw 9vh;
      gap: 4vh;
      opacity: 0;
      visibility: hidden;
      transform: translateY(14px);
      transition: opacity .5s ease, transform .5s cubic-bezier(.2, .7, .2, 1), visibility .5s;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .slide h1 {
      flex: none;
      font-weight: 700;
      font-size: clamp(28px, 6.5vh, 84px);
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    .slide h1 .time {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .slide h1 .dash {
      color: var(--dash);
      font-weight: 400;
    }

    .slide .media {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide .media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 1px 2px rgba(31, 35, 40, .06), 0 20px 50px -20px rgba(31, 35, 40, .25);
    }

    .slide .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      border: 1.5px dashed var(--line);
      border-radius: 24px;
      background: rgba(255, 255, 255, .6);
      backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: clamp(14px, 2.2vh, 22px);
      font-weight: 500;
      padding: 16px;
    }

    .slide .placeholder svg {
      width: clamp(32px, 6vh, 64px);
      height: auto;
      stroke: currentColor;
      opacity: .6;
    }

    /* Титульный слайд */
    .slide.cover {
      justify-content: center;
      gap: 2.5vh;
    }

    .slide .chip {
      align-self: flex-start;
      padding: .45em 1em;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: clamp(13px, 2vh, 20px);
      font-weight: 600;
    }

    .slide.cover h1 {
      font-size: clamp(44px, 14vh, 168px);
      letter-spacing: -.04em;
      line-height: 1;
    }

    .slide .subtitle {
      color: var(--muted);
      font-size: clamp(18px, 3.6vh, 40px);
      font-weight: 500;
      letter-spacing: -.01em;
    }

    /* Текстовые слайды (без изображения) */
    .slide.text {
      justify-content: safe center;
      gap: 3vh;
    }

    .slide.text h1 {
      font-size: clamp(36px, 10vh, 120px);
      letter-spacing: -.035em;
      line-height: 1.05;
      max-width: 20ch;
    }

    .slide .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.6vh;
      margin-top: 1vh;
      font-size: clamp(18px, 3.4vh, 40px);
      font-weight: 500;
      line-height: 1.3;
    }

    .slide .list li {
      display: flex;
      gap: .8em;
      align-items: baseline;
    }

    .slide .list .num {
      flex: none;
      min-width: 1.2em;
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .dots {
      position: fixed;
      left: 50%;
      bottom: 3.2vh;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      transition: width .35s ease, background .35s ease;
    }

    .dots span.active {
      width: 22px;
      background: var(--accent);
    }

    .counter {
      position: fixed;
      right: 6vw;
      bottom: 2.6vh;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      z-index: 10;
    }

    .nav {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 20vw;
      z-index: 5;
    }

    .nav.prev { left: 0; cursor: w-resize; }
    .nav.next { right: 0; cursor: e-resize; }

    @media (max-width: 600px) {
      .slide { padding: 5vh 16px 8vh; gap: 3vh; }
      .counter { right: 16px; }
      .dots { display: none; }
      .slide.text { gap: 2vh; }
      .slide.text h1 { font-size: clamp(28px, 9vw, 44px); }
      .slide .subtitle { font-size: 18px; }
      .slide .list { font-size: 17px; gap: 1.2vh; }
    }
  </style>
</head>
<body>
  <main class="deck" id="deck"></main>

  <div class="nav prev" id="prev" aria-label="Назад"></div>
  <div class="nav next" id="next" aria-label="Вперёд"></div>
  <div class="dots" id="dots"></div>
  <div class="counter" id="counter"></div>

  <script>
    // Пункты распорядка дня (Notion: Армия → Программа → 4) Распорядок дня).
    // Изображения кладите в папку images/ с номером слайда в имени:
    // images/01.jpg, images/02.png и т.д. (подходят .jpg, .jpeg, .png, .webp).
    // Можно указать и свой путь через поле image: "images/что-угодно.jpg".
    const SLIDES = [
      { time: "6:00",          title: "подъём" },
      { time: "6:10",          title: "зарядка / уборка территории" },
      { time: "6:50",          title: "утренний осмотр" },
      { time: "7:10",          title: "построение на завтрак, завтрак" },
      { time: "8:30",          title: "развод" },
      { time: "12:50",         title: "контрольное построение, обед" },
      { time: "14:30",         title: "второй развод" },
      { time: "17:50",         title: "контрольное построение" },
      { time: "18:30",         title: "ужин" },
      { time: "19:00 / 19:30", title: "свободное время" },
      { time: "21:00",         title: "«Панорама»" },
      { time: "21:20",         title: "прогулка" },
      { time: "21:40",         title: "вечерняя поверка" },
      { time: "22:00",         title: "отбой" },
    ];

    // Дополнительные слайды с фото сразу после распорядка дня (без времени).
    const EXTRAS = [
      { title: "Команда пожар", image: "images/extra-komanda-pozhar.jpg" },
      { title: "Кантик",        image: "images/extra-kantik.jpg" },
      { title: "Полосы",        image: "images/extra-polosy.jpg" },
      { title: "ПХД",           image: "images/extra-phd.jpg" },
      { title: "Уборка",        image: "images/extra-uborka.jpg" },
    ];

    // Текстовые блоки без изображений (Notion: Армия → Программа → 6) Проблемные моменты,
    // Другие темы). У каждого блока обзорный слайд со списком тем, затем по слайду на тему;
    // у темы с подпунктами сначала слайд со списком, затем по слайду на каждый подпункт.
    const PROBLEM_TOPICS = [
      {
        title: "Дедовщина (неуставные отношения)",
        items: [
          "Деление на периоды",
          "Правила и ограничения",
          "Чем мелкая «традиция» отличается от того, что нельзя терпеть",
        ],
      },
      { title: "Воровство и деньги" },
      { title: "Как говорить «нет»" },
      { title: "К кому обращаться" },
      { title: "Особенности тех, кто не принимает присяги" },
      { title: "Одиночество" },
      { title: "Испытания и искушения (давление быть как все)" },
    ];

    const OTHER_TOPICS = [
      { title: "Евангелизация" },
      { title: "Инициатива наказуема" },
      { title: "Наряды" },
      { title: "Что с собой взять" },
    ];

    const SECTIONS = [
      { title: "Проблемные моменты", subtitle: "Обсуждаем проблемные ситуации в армии", topics: PROBLEM_TOPICS },
      { title: "Другие темы", topics: OTHER_TOPICS },
    ];

    const EXTENSIONS = ["jpg", "jpeg", "png", "webp"];

    const IMAGE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.6-4.6a1.5 1.5 0 0 0-2.1 0L5 19.5"/></svg>';

    const deck = document.getElementById("deck");
    const counter = document.getElementById("counter");
    const dots = document.getElementById("dots");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function placeholder(text) {
      const node = el("div", "placeholder");
      node.innerHTML = IMAGE_ICON;
      node.append(el("div", null, text));
      return node;
    }

    // Пробует по очереди все расширения; если ни одного файла нет — показывает заглушку.
    function loadImage(media, candidates, placeholderText) {
      if (!candidates.length) {
        media.replaceChildren(placeholder(placeholderText));
        return;
      }
      const img = new Image();
      img.alt = "";
      img.onload = () => media.replaceChildren(img);
      img.onerror = () => loadImage(media, candidates.slice(1), placeholderText);
      img.src = candidates[0];
    }

    function buildCover() {
      const slide = el("section", "slide cover");
      const first = SLIDES[0].time;
      const last = SLIDES[SLIDES.length - 1].time;
      slide.append(
        el("div", "chip", `${first} – ${last}`),
        el("h1", null, "Распорядок дня"),
        el("div", "subtitle", "Как проходит один день в армии")
      );
      return slide;
    }

    function buildSlide(item, index) {
      const slide = el("section", "slide");
      const h1 = el("h1");
      if (item.time) h1.append(el("span", "time", item.time), el("span", "dash", " — "));
      h1.append(document.createTextNode(item.title));

      const media = el("div", "media");
      const num = String(index + 1).padStart(2, "0");
      const candidates = item.image ? [item.image] : EXTENSIONS.map(ext => `images/${num}.${ext}`);
      loadImage(media, candidates, `images/${num}.jpg`);

      slide.append(h1, media);
      return slide;
    }

    function list(items, numbering) {
      const ol = el("ol", "list");
      items.forEach((text, i) => {
        const li = el("li");
        li.append(el("span", "num", numbering(i)), el("span", null, text));
        ol.append(li);
      });
      return ol;
    }

    function buildTextSlide(chip, title, extra) {
      const slide = el("section", "slide text");
      if (chip) slide.append(el("div", "chip", chip));
      slide.append(el("h1", null, title), ...extra);
      return slide;
    }

    // Финальный слайд, оформлен как титульный.
    function buildQaSlide() {
      const slide = el("section", "slide cover");
      slide.append(el("h1", null, "Вопросы-ответы"));
      return slide;
    }

    function buildSectionCover(section) {
      return buildTextSlide(null, section.title, [
        ...(section.subtitle ? [el("div", "subtitle", section.subtitle)] : []),
        list(section.topics.map(t => t.title), i => String(i + 1)),
      ]);
    }

    function buildTopicSlides(section, topic, index) {
      const n = index + 1;
      const items = topic.items || [];
      const shortTitle = topic.title.replace(/\s*\(.*\)$/, "");
      return [
        buildTextSlide(`${section.title} · ${n}`, topic.title,
          items.length ? [list(items, i => `${n}.${i + 1}`)] : []),
        ...items.map((item, i) => buildTextSlide(`${shortTitle} · ${n}.${i + 1}`, item, [])),
      ];
    }

    const slides = [
      buildCover(),
      ...SLIDES.map(buildSlide),
      ...EXTRAS.map(buildSlide),
      ...SECTIONS.flatMap(section => [
        buildSectionCover(section),
        ...section.topics.flatMap((topic, i) => buildTopicSlides(section, topic, i)),
      ]),
      buildQaSlide(),
    ];
    deck.append(...slides);
    const dotNodes = slides.map(() => el("span"));
    dots.append(...dotNodes);

    let current = 0;

    function show(i) {
      current = Math.max(0, Math.min(slides.length - 1, i));
      slides.forEach((s, n) => s.classList.toggle("active", n === current));
      dotNodes.forEach((d, n) => d.classList.toggle("active", n === current));
      counter.textContent = `${current + 1} / ${slides.length}`;
      history.replaceState(null, "", `#${current + 1}`);
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    }

    document.addEventListener("keydown", e => {
      switch (e.key) {
        case "ArrowRight": case "ArrowDown": case "PageDown": case " ": case "Enter":
          e.preventDefault(); show(current + 1); break;
        case "ArrowLeft": case "ArrowUp": case "PageUp": case "Backspace":
          e.preventDefault(); show(current - 1); break;
        case "Home": show(0); break;
        case "End": show(slides.length - 1); break;
        case "f": case "F": case "а": case "А": toggleFullscreen(); break;
      }
    });

    document.getElementById("prev").addEventListener("click", () => show(current - 1));
    document.getElementById("next").addEventListener("click", () => show(current + 1));

    let touchX = null;
    document.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
      touchX = null;
    });

    const fromHash = () => show((parseInt(location.hash.slice(1), 10) || 1) - 1);
    window.addEventListener("hashchange", fromHash);
    fromHash();
  </script>
</body>
</html>
